apiVersion: apps/v1
kind: Deployment
metadata:
  name: grantdeck
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: grantdeck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grantdeck
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grantdeck
          image: ghcr.io/troeger/grantdeck:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: grantdeck-config
            - secretRef:
                name: grantdeck-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: grantdeck.example.com
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: grantdeck.example.com
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz/
              port: http
              httpHeaders:
                - name: Host
                  value: grantdeck.example.com
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
