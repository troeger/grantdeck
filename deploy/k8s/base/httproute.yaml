apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grantdeck
spec:
  parentRefs:
    - name: edge
      namespace: gateway-system
      sectionName: grantdeck
  hostnames:
    - grantdeck.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: grantdeck
          port: 8000
