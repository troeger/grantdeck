{% extends "frontend/base.html" %}

{% block title %}Login{% endblock %}
{% block page_class %}login-shell{% endblock %}

{% block content %}
  <section class="login-panel" aria-labelledby="login-title">
    <div class="border rounded p-4">
      <h1 id="login-title">{{ brand_name }}</h1>

      <form class="mt-3" method="post" action="{% url 'auth:begin' 'oidc' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary">{{ sso_login_button_text }}</button>
      </form>
    </div>
  </section>
{% endblock %}
